# CI with deliberately ZERO cloud credentials: lint, tests (moto-mocked), template validation.
# Deploys are local-only by design; see docs/adr for the reasoning.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# This workflow needs to read the repo and nothing else. Without an explicit block the
# GITHUB_TOKEN inherits the repository default, which can be write-all -- a compromised or
# typosquatted action would then be able to push commits or move tags.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHAs: a mutable tag like @v4 can be repointed at new code by anyone
      # who controls the action repo. SHAs are frozen at the versions already proven green --
      # pinning is for immutability, not for upgrading.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: python -m ruff check src scripts tests
      - name: pytest
        run: python -m pytest -q
        env:
          AWS_DEFAULT_REGION: us-east-1
      # the lab template has no SAM Transform, so `sam validate` can't read it -- cfn-lint
      # directly; the platform template is covered by `sam validate --lint` below (which runs
      # cfn-lint internally, plus transform validation)
      - name: cfn-lint lab template
        run: cfn-lint lab/template.yaml
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
      - name: sam validate
        run: sam validate --lint
        env:
          SAM_CLI_TELEMETRY: "0"
