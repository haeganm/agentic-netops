# Local parity: DynamoDB Local (ledger/config) + Ollama (diagnosis). No LocalStack --
# EventBridge/SFN/Reachability Analyzer/EC2 mutation are cloud-verified per build phase.
# Images digest-pinned for the same reason ci.yml SHA-pins its actions: a mutable tag can be
# repointed. Tag is for readability, the digest is what's enforced.
services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama:0.33.1@sha256:075246f72d4109385b4a01c3ac8e9cbd26a0bcb21cd7aa30edbccd24e1b3180c
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
