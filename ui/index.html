<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netops // closed loop</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11151f; --panel2: #171c2a; --line: #232a3d;
    --text: #c9d4e8; --dim: #6b7794; --accent: #4ecdc4; --warn: #ffb454;
    --bad: #ff6b6b; --good: #79dc77; --info: #6ea8ff;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 "Cascadia Code", "Consolas", monospace; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; letter-spacing: 2px; color: var(--accent); }
  header h1 span { color: var(--dim); }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button { background: none; border: 1px solid transparent; color: var(--dim); font: inherit; padding: 6px 14px; cursor: pointer; border-radius: 4px; }
  nav button.active { color: var(--accent); border-color: var(--line); background: var(--panel); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: 14px; }
  .muted { color: var(--dim); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--dim); font-weight: normal; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--panel2); }
  .pill { padding: 2px 10px; border-radius: 10px; font-size: 12px; white-space: nowrap; }
  .s-RESOLVED, .s-FALSE_POSITIVE { background: #12351f; color: var(--good); }
  .s-VERIFICATION_LIMITED { background: #2e3312; color: var(--warn); }
  .s-FAILED, .s-GATE_BLOCKED, .s-REJECTED { background: #3a1620; color: var(--bad); }
  .s-AWAITING_APPROVAL, .s-AWAITING_SECOND_APPROVAL { background: #3a2c12; color: var(--warn); }
  .s-AUTO_EXEC_PENDING { background: #123033; color: var(--accent); }
  .s-EXPIRED, .s-CANCELLED { background: #222; color: var(--dim); }
  .s-DETECTED, .s-PROVING, .s-EXECUTING { background: #16263f; color: var(--info); }
  .tier { padding: 2px 8px; border-radius: 4px; font-size: 11px; letter-spacing: 1px; }
  .tier-LOW { background: #12351f; color: var(--good); }
  .tier-MEDIUM { background: #3a2c12; color: var(--warn); }
  .tier-HIGH { background: #3a1620; color: var(--bad); }
  .stage { display: inline-block; min-width: 130px; color: var(--accent); font-size: 12px; }
  .actor { color: var(--dim); font-size: 12px; min-width: 140px; display: inline-block; }
  .entry { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .entry pre { color: var(--dim); font-size: 12px; white-space: pre-wrap; word-break: break-all; margin-top: 4px; max-height: 200px; overflow: auto; }
  .btn { font: inherit; padding: 8px 20px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; background: var(--panel2); color: var(--text); }
  .btn.approve { background: #143620; color: var(--good); border-color: #1f5c33; }
  .btn.reject { background: #3a1620; color: var(--bad); border-color: #6b2437; }
  .btn:disabled { opacity: .4; cursor: default; }
  input { background: var(--panel2); border: 1px solid var(--line); color: var(--text); font: inherit; padding: 8px 12px; border-radius: 6px; width: 100%; margin-bottom: 10px; }
  #login { max-width: 360px; margin: 12vh auto; }
  .bar { height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; margin: 8px 0; }
  .bar div { height: 100%; background: var(--accent); }
  .kv { display: grid; grid-template-columns: 160px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv .muted { text-align: right; }
  h2 { font-size: 14px; letter-spacing: 1px; margin-bottom: 12px; color: var(--dim); }
  #err { color: var(--bad); min-height: 20px; font-size: 13px; }
  .loop { color: var(--dim); font-size: 12px; margin-bottom: 14px; letter-spacing: 1px; }
  .loop b { color: var(--accent); font-weight: normal; }
</style>
</head>
<body>
<header>
  <h1>NETOPS<span> // closed loop</span></h1>
  <nav id="nav" hidden>
    <button data-tab="incidents" class="active">incidents</button>
    <button data-tab="evals">evals</button>
    <button data-tab="budget">budget</button>
    <button id="logout">logout</button>
  </nav>
</header>
<main>
  <div id="login" class="card">
    <h2>OPERATOR SIGN-IN</h2>
    <input id="email" type="email" placeholder="email" autocomplete="username">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button class="btn" id="signin">sign in</button>
    <p id="err"></p>
  </div>

  <div id="app" hidden>
    <p class="loop">DETECT &rarr; PROVE &rarr; MEASURE &rarr; GENERATE-REPAIR &rarr; <b>APPROVE</b> &rarr; EXECUTE &rarr; VERIFY</p>
    <div id="tab-incidents"></div>
    <div id="tab-evals" hidden></div>
    <div id="tab-budget" hidden></div>
  </div>
</main>

<script src="config.js"></script>
<script>
"use strict";
let token = sessionStorage.getItem("netops_jwt") || "";
let currentIncident = null;
let lastDecided = {id: null, at: 0};  // suppresses live-looking buttons rendered from stale meta right after a decision
let timer = null;          // 15s list poll
let refreshT = null;       // 10s incident-detail self-refresh (single, never stacked)
let countdownIv = null;    // veto countdown (single, cleared on every view change)

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

// one visible error surface for the app view; every loader routes failures here so an API
// outage reads as a message, not a silently blank tab
const apperr = el("p");
apperr.style.cssText = "color:var(--bad);margin:8px 0";
apperr.hidden = true;
function showErr(msg) { apperr.textContent = msg || ""; apperr.hidden = !msg; }
const load = (fn) => fn().then(() => showErr("")).catch((e) => showErr("load failed: " + e.message));

async function api(path, opts = {}) {
  const r = await fetch(CONFIG.apiUrl + path, {
    ...opts,
    headers: {Authorization: "Bearer " + token, "Content-Type": "application/json", ...(opts.headers || {})},
  });
  if (r.status === 401) { logout("session expired — sign in again"); throw new Error("session expired"); }
  const body = await r.json().catch(() => ({}));  // a proxy 5xx body may not be JSON
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
}

async function signin() {
  $("err").textContent = "";
  try {
    const r = await fetch(`https://cognito-idp.${CONFIG.region}.amazonaws.com/`, {
      method: "POST",
      headers: {"Content-Type": "application/x-amz-json-1.1",
                "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth"},
      body: JSON.stringify({AuthFlow: "USER_PASSWORD_AUTH", ClientId: CONFIG.clientId,
                            AuthParameters: {USERNAME: $("email").value, PASSWORD: $("password").value}}),
    });
    const data = await r.json().catch(() => ({}));  // non-JSON body (proxy error page)
    if (!data.AuthenticationResult) throw new Error(data.message
      || (data.ChallengeName ? "sign-in challenge " + data.ChallengeName + " — ask an admin to re-set your password (create_user.ps1)"
                             : "sign-in failed (" + r.status + ")"));
    token = data.AuthenticationResult.IdToken;
    sessionStorage.setItem("netops_jwt", token);
    boot();
  } catch (e) { $("err").textContent = e.message; }
}

function logout(msg) {
  token = ""; sessionStorage.removeItem("netops_jwt");
  clearInterval(timer); clearTimeout(refreshT); clearInterval(countdownIv);
  currentIncident = null;
  $("app").hidden = true; $("nav").hidden = true; $("login").hidden = false;
  $("err").textContent = msg || "";
}

function boot() {
  $("login").hidden = true; $("nav").hidden = false; $("app").hidden = false;
  $("app").prepend(apperr);
  showTab("incidents");
  clearInterval(timer);
  timer = setInterval(() => { if (!currentIncident) load(loadIncidents); }, 15000);
}

function showTab(name) {
  currentIncident = null;
  clearTimeout(refreshT); clearInterval(countdownIv);
  for (const b of document.querySelectorAll("#nav button[data-tab]"))
    b.classList.toggle("active", b.dataset.tab === name);
  for (const t of ["incidents", "evals", "budget"]) $("tab-" + t).hidden = t !== name;
  if (name === "incidents") load(loadIncidents);
  if (name === "evals") load(loadEvals);
  if (name === "budget") load(loadBudget);
}

async function loadIncidents() {
  const items = await api("/incidents");
  const root = $("tab-incidents");
  root.replaceChildren();
  const card = el("div", "card");
  card.append(el("h2", "", "INCIDENTS"));
  if (!items.length) { card.append(el("p", "muted", "no incidents - the network matches its declared intent")); root.append(card); return; }
  const tbl = el("table");
  const hr = el("tr");
  for (const h of ["id", "detected", "fault class", "llm agrees", "status"]) hr.append(el("th", "", h));
  tbl.append(hr);
  for (const i of items) {
    const id = i.pk.split("#")[1];
    const tr = el("tr", "row");
    tr.append(el("td", "", id));
    tr.append(el("td", "muted", (i.created_at || "").replace("T", " ").replace("Z", "")));
    tr.append(el("td", "", i.fault_class || "-"));
    tr.append(el("td", "muted", i.llm_fault_class ? (i.llm_fault_class === i.fault_class ? "yes" : "no: " + i.llm_fault_class) : "-"));
    const td = el("td");
    td.append(el("span", "pill s-" + (i.status || ""), i.status || "?"));
    tr.append(td);
    tr.onclick = () => load(() => loadIncident(id));  // via load(): a failed fetch must surface, not silently freeze the poll
    tbl.append(tr);
  }
  card.append(tbl);
  root.append(card);
}

async function loadIncident(id) {
  currentIncident = id;
  clearTimeout(refreshT); clearInterval(countdownIv);  // this view owns at most one of each
  const {meta, ledger} = await api("/incidents/" + id);
  if (currentIncident !== id) return;  // a newer click won the race -- don't render a stale incident over it
  const root = $("tab-incidents");
  root.replaceChildren();

  const back = el("button", "btn", "< back");
  back.onclick = () => showTab("incidents");  // resets currentIncident AND both timers
  root.append(back);

  const head = el("div", "card");
  head.append(el("h2", "", "INCIDENT " + id));
  const kv = el("div", "kv");
  const rows = [["status", meta.status], ["autonomy tier", meta.tier],
                ["fault class (deterministic)", meta.fault_class],
                ["change caused by", meta.drift_actor], ["detected", meta.created_at],
                ["resolved", meta.resolved_at], ["ra analyses", meta.ra_analyses_used],
                ["plan hash", meta.plan_hash]];
  for (const [k, v] of rows) {
    kv.append(el("span", "muted", k));
    if (k === "autonomy tier" && v) { const c = el("span"); c.append(el("span", "tier tier-" + v, v)); kv.append(c); }
    else kv.append(el("span", "", String(v ?? "-")));
  }
  head.append(kv);
  if (Array.isArray(meta.tier_reasons) && meta.tier_reasons.length)
    head.append(el("p", "muted", "tier reasons: " + meta.tier_reasons.join("; ")));
  // integrity controls: verify the tamper-evident ledger + download the compliance evidence
  const tools = el("div"); tools.style.marginTop = "10px";
  const vb = el("button", "btn", "verify ledger");
  vb.onclick = async () => {
    // a trust control must never silently no-op: "could not check" and "not checked yet"
    // have to look different
    try {
      const r = await api(`/incidents/${id}/verify`);
      vb.textContent = r.valid ? `ledger VALID (${r.length} entries)` : `ledger BROKEN @seq ${r.first_break_seq}`;
      vb.style.color = r.valid ? "var(--good)" : "var(--bad)";
    } catch (e) { vb.textContent = "verify FAILED: " + e.message; vb.style.color = "var(--bad)"; }
  };
  const eb = el("button", "btn", "download evidence");
  eb.style.marginLeft = "8px";
  eb.onclick = async () => {
    try {
      const r = await api(`/incidents/${id}/evidence`);
      const blob = new Blob([JSON.stringify(r, null, 2)], {type: "application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = `evidence-${id}.json`;
      document.body.append(a); a.click(); a.remove();
      // deferred: a synchronous revoke races the download start on WebKit (silent no-op)
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch (e) { alert("evidence export failed: " + e.message); }
  };
  tools.append(vb, eb);
  head.append(tools);
  root.append(head);

  const planCard = (title) => {
    const act = el("div", "card");
    act.append(el("h2", "", title));
    const facts = el("div", "kv");
    facts.append(el("span", "muted", "deterministic fault")); facts.append(el("span", "", meta.fault_class || "-"));
    facts.append(el("span", "muted", "plan hash")); facts.append(el("span", "", meta.plan_hash || "-"));
    if (meta.drift_actor) { facts.append(el("span", "muted", "caused by")); facts.append(el("span", "", meta.drift_actor)); }
    act.append(facts);
    let opsTxt;  // unparseable plan_ops must degrade to raw text, not blank the whole view
    try { opsTxt = JSON.stringify(JSON.parse(meta.plan_ops || "[]"), null, 2); }
    catch { opsTxt = String(meta.plan_ops); }
    const pre = el("pre", "", opsTxt);
    pre.style.color = "var(--text)"; pre.style.fontSize = "12px"; pre.style.margin = "10px 0";
    act.append(pre);
    if (meta.plan_rationale || meta.llm_summary) {
      const note = el("div");
      note.style.cssText = "border-left:3px solid var(--warn);background:var(--panel2);padding:8px 12px;margin:10px 0;font-size:12px;color:var(--dim)";
      note.append(el("div", "", "⚠ unverified AI note (not a decision input):"));
      note.append(el("div", "", (meta.plan_rationale || meta.llm_summary || "")));
      act.append(note);
    }
    return act;
  };

  if (meta.status === "AWAITING_APPROVAL" || meta.status === "AWAITING_SECOND_APPROVAL") {
    const second = meta.status === "AWAITING_SECOND_APPROVAL";
    const act = planCard(second ? "SECOND APPROVAL REQUIRED (two-party control)" : "REMEDIATION PLAN AWAITING YOUR APPROVAL");
    if (second) act.append(el("p", "muted", "first approver: " + (meta.first_approver || "?") + " — a DISTINCT operator must approve."));
    const ok = el("button", "btn approve", second ? "APPROVE as second party" : "APPROVE - converge to baseline");
    const no = el("button", "btn reject", "reject");
    no.style.marginLeft = "10px";
    // symmetric handling: a 403 (SoD recusal) or 409 must re-enable the buttons and say why,
    // never leave both dead; the re-render itself can fail too, hence load()
    const decide = (path, body) => async () => {
      ok.disabled = no.disabled = true;
      try {
        await api(`/incidents/${id}/${path}`, {method: "POST", ...(body ? {body} : {})});
        lastDecided = {id, at: Date.now()};  // workflow is advancing; stale meta may still say AWAITING for a few seconds
      }
      catch (e) { alert(e.message); ok.disabled = no.disabled = false; }
      load(() => loadIncident(id));
    };
    ok.onclick = decide("approve");
    no.onclick = decide("reject", JSON.stringify({reason: "operator reject"}));
    if (lastDecided.id === id && Date.now() - lastDecided.at < 15000) {
      ok.disabled = no.disabled = true;
      act.append(ok, no, el("p", "muted", "decision recorded — refreshing…"));
    } else {
      act.append(ok, no);
    }
    root.append(act);
  } else if (meta.status === "AUTO_EXEC_PENDING") {
    const act = planCard("LOW-TIER AUTO-EXECUTE — cancel to veto");
    const cd = el("p", ""); cd.style.color = "var(--accent)";
    act.append(cd);
    const tick = () => {
      const left = Math.max(0, Math.round((new Date(meta.veto_deadline) - new Date()) / 1000));
      cd.textContent = `auto-executing in ~${left}s unless you cancel…`;
    };
    tick(); countdownIv = setInterval(tick, 1000);
    const cancel = el("button", "btn reject", "CANCEL (veto auto-execution)");
    cancel.onclick = async () => {
      clearInterval(countdownIv); cancel.disabled = true;
      try { await api(`/incidents/${id}/cancel`, {method: "POST"}); }
      catch (e) { alert(e.message); cancel.disabled = false; }
      load(() => loadIncident(id));
    };
    act.append(cancel);
    root.append(act);
  }

  const led = el("div", "card");
  led.append(el("h2", "", "DECISION LEDGER"));
  for (const e of ledger) {
    const d = el("div", "entry");
    const line = el("div");
    line.append(el("span", "stage", e.stage));
    line.append(el("span", "actor", e.actor));
    line.append(el("span", "muted", (e.sk || "").split("#")[1] || ""));
    d.append(line);
    try { d.append(el("pre", "", JSON.stringify(JSON.parse(e.payload), null, 1))); }
    catch { d.append(el("pre", "", e.payload)); }
    led.append(d);
  }
  root.append(led);
  if (["DETECTED", "PROVING", "EXECUTING", "AWAITING_APPROVAL",
       "AWAITING_SECOND_APPROVAL", "AUTO_EXEC_PENDING"].includes(meta.status)) {
    clearTimeout(refreshT);  // one refresh chain per view -- user actions must not stack more
    refreshT = setTimeout(() => { if (currentIncident === id) load(() => loadIncident(id)); }, 10000);
  }
}

async function loadEvals() {
  const items = await api("/evals");
  const root = $("tab-evals");
  root.replaceChildren();
  const card = el("div", "card");
  card.append(el("h2", "", "EVAL RUNS (release gate: diagnosis >= 8/9, remediation 9/9)"));
  if (!items.length) { card.append(el("p", "muted", "no eval runs yet - scripts/evaluate.py")); }
  else {
    const tbl = el("table");
    const hr = el("tr");
    for (const h of ["run", "model", "diagnosed", "remediated", "mean mttr", "cost"]) hr.append(el("th", "", h));
    tbl.append(hr);
    for (const r of items) {
      const tr = el("tr");
      tr.append(el("td", "", r.pk.split("#")[1]));
      tr.append(el("td", "muted", r.model_id || "-"));
      tr.append(el("td", "", `${r.diagnosed}/${r.total}`));
      tr.append(el("td", "", `${r.remediated}/${r.total}`));
      tr.append(el("td", "", (r.mean_mttr_s || 0) + "s"));
      tr.append(el("td", "", "$" + (r.cost_usd || "0")));
      tbl.append(tr);
    }
    card.append(tbl);
  }
  root.append(card);
}

async function loadBudget() {
  const b = await api("/limits");
  const root = $("tab-budget");
  root.replaceChildren();
  const card = el("div", "card");
  card.append(el("h2", "", "REACHABILITY ANALYZER BUDGET (hard cap in code, ADR 0005)"));
  card.append(el("p", "", `${b.ra_used} / ${b.ra_cap} analyses used ($${(b.ra_used * 0.1).toFixed(2)} of $${(b.ra_cap * 0.1).toFixed(2)})`));
  const bar = el("div", "bar");
  const fill = el("div");
  fill.style.width = Math.min(100, 100 * b.ra_used / (b.ra_cap || 1)) + "%";
  bar.append(fill);
  card.append(bar);
  card.append(el("p", "muted", "past the cap, incidents still close but are labeled VERIFICATION_LIMITED - never silently unverified"));
  root.append(card);
}

$("signin").onclick = signin;
$("password").addEventListener("keydown", (e) => { if (e.key === "Enter") signin(); });
$("logout").onclick = () => logout();  // not bound directly: logout(msg) would print the click event
for (const b of document.querySelectorAll("#nav button[data-tab]"))
  b.onclick = () => showTab(b.dataset.tab);
if (token) boot();
</script>
</body>
</html>
