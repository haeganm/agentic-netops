# The LAB NETWORK: the drift target. This template IS the declared intent --
# the baseline snapshot is captured from it at deploy, chaos breaks the live copy,
# and the platform's only legal remediation is converging live state back to this.
# Everything here is free: no NAT, no interface endpoints, no EIPs, no instances.
AWSTemplateFormatVersion: '2010-09-09'
Description: Agentic NetOps lab VPC (drift target, $0)

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Project, Value: agentic-netops}, {Key: Name, Value: netops-lab}]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Project, Value: agentic-netops}]

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/26
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Project, Value: agentic-netops}, {Key: Name, Value: netops-lab-public}]

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.64/26
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Project, Value: agentic-netops}, {Key: Name, Value: netops-lab-private}]

  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Project, Value: agentic-netops}, {Key: Name, Value: netops-lab-public}]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRt
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  PrivateRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Project, Value: agentic-netops}, {Key: Name, Value: netops-lab-private}]

  PublicRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRt

  PrivateRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRt

  # NACL on the private subnet: explicit allows only, so a seeded deny at a lower
  # rule number (chaos class nacl-deny-inserted) visibly breaks the data path.
  PrivateNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Project, Value: agentic-netops}, {Key: Name, Value: netops-lab-private}]

  NaclEgressHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 443, To: 443}

  NaclEgressVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 110
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 10.42.0.0/24

  NaclIngressEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 1024, To: 65535}

  NaclIngressVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 110
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: 10.42.0.0/24

  NaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      NetworkAclId: !Ref PrivateNacl

  ProbeSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: netops probe - egress 443 only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
      Tags: [{Key: Project, Value: agentic-netops}, {Key: Name, Value: netops-probe}]

  AnchorPublicSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: netops anchor public - ingress 443 from VPC
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 10.42.0.0/24}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
      Tags: [{Key: Project, Value: agentic-netops}, {Key: Name, Value: netops-anchor-public}]

  AnchorPrivateSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: netops anchor private - egress 443 to VPC
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 10.42.0.0/24}
      Tags: [{Key: Project, Value: agentic-netops}, {Key: Name, Value: netops-anchor-private}]

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PublicRt, !Ref PrivateRt]

  # Unattached anchor ENIs: free, CFN-referenceable Reachability Analyzer endpoints.
  AnchorEniPublic:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref PublicSubnet
      GroupSet: [!Ref AnchorPublicSg]
      Description: netops RA anchor (public)
      Tags: [{Key: Project, Value: agentic-netops}]

  AnchorEniPrivate:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref PrivateSubnet
      GroupSet: [!Ref AnchorPrivateSg]
      Description: netops RA anchor (private)
      Tags: [{Key: Project, Value: agentic-netops}]

  # Paths are free; only analyses run against them are billed ($0.10, hard-capped in code).
  PathPrivateToPublic:
    Type: AWS::EC2::NetworkInsightsPath
    Properties:
      Source: !Ref AnchorEniPrivate
      Destination: !Ref AnchorEniPublic
      Protocol: tcp
      DestinationPort: 443
      Tags: [{Key: Project, Value: agentic-netops}]

  PathPublicToIgw:
    Type: AWS::EC2::NetworkInsightsPath
    Properties:
      Source: !Ref AnchorEniPublic
      Destination: !Ref Igw
      Protocol: tcp
      DestinationPort: 443
      Tags: [{Key: Project, Value: agentic-netops}]

Outputs:
  VpcId: {Value: !Ref Vpc}
  VpcCidr: {Value: 10.42.0.0/24}
  IgwId: {Value: !Ref Igw}
  PublicSubnetId: {Value: !Ref PublicSubnet}
  PrivateSubnetId: {Value: !Ref PrivateSubnet}
  PublicRtId: {Value: !Ref PublicRt}
  PrivateRtId: {Value: !Ref PrivateRt}
  PublicRtAssocId: {Value: !Ref PublicRtAssoc}
  PrivateRtAssocId: {Value: !Ref PrivateRtAssoc}
  PrivateNaclId: {Value: !Ref PrivateNacl}
  ProbeSgId: {Value: !Ref ProbeSg}
  AnchorPublicSgId: {Value: !Ref AnchorPublicSg}
  AnchorPrivateSgId: {Value: !Ref AnchorPrivateSg}
  AnchorEniPublicId: {Value: !Ref AnchorEniPublic}
  AnchorEniPrivateId: {Value: !Ref AnchorEniPrivate}
  PathPrivateToPublicId: {Value: !Ref PathPrivateToPublic}
  PathPublicToIgwId: {Value: !Ref PathPublicToIgw}
  S3EndpointId: {Value: !Ref S3GatewayEndpoint}
